<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>InfoLive Brasil — LensCtrl</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23EA083D'/><text y='.88em' font-size='72' x='13'>🎥</text></svg>"/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Geist:wght@400;500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;background:#0A0C10;}

/* ── NAV BAR ── */
#nav-bar{
  position:fixed;top:0;left:0;right:0;height:52px;
  background:rgba(10,12,16,0.97);
  border-bottom:1px solid #30363D;
  display:flex;align-items:center;
  padding:0 12px;gap:2px;
  z-index:9999;
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
}

.nav-logo{
  display:flex;align-items:center;gap:8px;margin-right:8px;
  text-decoration:none;flex-shrink:0;
}
.nav-logo-box{
  background:#EA083D;padding:3px 9px;border-radius:4px;
  font-family:'Sora',sans-serif;font-size:13px;font-weight:700;
  color:#fff;letter-spacing:1px;
}
.nav-logo-sub{
  font-family:'Sora',sans-serif;font-size:12px;font-weight:600;
  color:#ffb3b3;
}

/* Tabs desktop */
.nav-tabs{
  display:flex;align-items:center;gap:2px;
  overflow-x:auto;scrollbar-width:none;
}
.nav-tabs::-webkit-scrollbar{display:none;}

.nav-tab{
  display:flex;align-items:center;gap:5px;
  padding:5px 10px;border-radius:20px;
  font-family:'Geist',sans-serif;font-size:12px;font-weight:600;
  letter-spacing:0.04em;color:#b0b4c8;
  border:none;background:transparent;cursor:pointer;
  transition:all .15s;white-space:nowrap;flex-shrink:0;
}
.nav-tab .mi{
  font-family:'Material Symbols Outlined';
  font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20;
  font-size:16px;line-height:1;vertical-align:middle;
}
.nav-tab span:not(.mi):not(.nav-badge){
  display:none;
}
@media(min-width:480px){
  .nav-tab span:not(.mi):not(.nav-badge){ display:inline; }
  #nav-bar{ padding:0 16px; gap:4px; }
}
.nav-tab:hover{background:#1e2024;color:#e2e2e8;}
.nav-tab.active{background:#414657;color:#e2e2e8;}
.nav-tab.active .mi{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 20;}

.nav-badge{
  background:#EA083D;color:#fff;
  font-size:9px;font-weight:700;
  padding:1px 5px;border-radius:10px;
  line-height:1.4;
}

/* Right side */
.nav-right{margin-left:auto;display:flex;align-items:center;gap:6px;flex-shrink:0;}
.nav-version{
  font-family:'Geist',monospace;font-size:10px;color:#5d5d7a;
  letter-spacing:0.05em;padding:2px 6px;
  border:1px solid #30363D;border-radius:4px;
  display:none;
}
@media(min-width:640px){ .nav-version{display:block;} }

.nav-avatar{
  width:28px;height:28px;border-radius:50%;
  background:#414657;border:1px solid #30363D;
  display:flex;align-items:center;justify-content:center;
  font-family:'Sora',sans-serif;font-size:10px;font-weight:700;color:#ffb3b3;
  flex-shrink:0;
}

/* ── FRAME WRAP ── */
#frame-wrap{
  position:fixed;top:52px;left:0;right:0;bottom:0;
}
.frame-page{
  position:absolute;inset:0;
  border:none;width:100%;height:100%;
  opacity:0;pointer-events:none;
  transition:opacity .18s ease;
}
.frame-page.active{
  opacity:1;pointer-events:auto;
}

/* Powered by */
#powered{
  position:fixed;bottom:8px;right:12px;
  font-family:'Geist',sans-serif;font-size:10px;
  color:rgba(177,180,200,0.25);letter-spacing:0.05em;
  z-index:9999;pointer-events:none;
  display:none;
}
@media(min-width:768px){ #powered{display:block;} }
</style>
</head>
<body>

<div id="nav-bar">
  <a class="nav-logo" href="#" onclick="showPage('login');return false;">
    <img src="logo.svg" alt="InfoLive Brasil" style="height:30px;width:auto;object-fit:contain;flex-shrink:0;">
  </a>

  <nav class="nav-tabs" id="nav-tabs">
    <button class="nav-tab" id="tab-login" onclick="showPage('login')">
      <span class="mi">login</span>
      <span>Login</span>
    </button>
    <button class="nav-tab" id="tab-dashboard" onclick="showPage('dashboard')">
      <span class="mi">dashboard</span>
      <span>Dashboard</span>
      <span class="nav-badge">08</span>
    </button>
    <button class="nav-tab" id="tab-inventory" onclick="showPage('inventory')">
      <span class="mi">inventory_2</span>
      <span>Inventário</span>
    </button>
    <button class="nav-tab" id="tab-movements" onclick="showPage('movements')">
      <span class="mi">sync_alt</span>
      <span>Movimentações</span>
    </button>
  </nav>

  <div class="nav-right">
    <span class="nav-version">v1.0.4</span>
    <div class="nav-avatar">LG</div>
  </div>
</div>

<div id="frame-wrap">
  <iframe class="frame-page" id="frame-login"     src="login.html"     title="Login"></iframe>
  <iframe class="frame-page" id="frame-dashboard" src="dashboard.html" title="Dashboard"></iframe>
  <iframe class="frame-page" id="frame-inventory" src="inventory.html" title="Inventário"></iframe>
  <iframe class="frame-page" id="frame-movements" src="movements.html" title="Movimentações"></iframe>
</div>

<div id="powered">Powered by Force Training</div>

<script>
let current = 'login';

// Show logo full text on wider screens
function updateLogo() {
  document.getElementById('logo-full').style.display = window.innerWidth >= 480 ? 'block' : 'none';
}
updateLogo();
window.addEventListener('resize', updateLogo);

function showPage(name) {
  document.querySelectorAll('.frame-page').forEach(f => f.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('frame-' + name).classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
  current = name;
}

showPage('login');

window.addEventListener('message', (e) => {
  if (e.data && e.data.navigate) showPage(e.data.navigate);
});

document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault();
    const frame = document.getElementById('frame-' + current);
    try { frame.contentDocument.querySelector('input[type="text"]')?.focus(); } catch(_) {}
  }
});
</script>
</body>
</html>
