<!-- Entrar Form -->
<form class="w-full space-y-stack-lg" id="login-form" onsubmit="event.preventDefault(); try { window.parent.postMessage({navigate:'dashboard'},'*'); } catch(e){} ">
<div class="space-y-stack-sm">
<label class="font-label-md text-label-md text-secondary ml-1" for="employee-id">ID DO FUNCIONÁRIO</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-stack-md text-on-surface-variant pointer-events-none">badge</span>
<input class="w-full h-12 bg-surface-container-lowest border border-border-subtle rounded-lg pl-12 pr-stack-md text-on-background font-mono-data focus:border-tertiary focus:ring-1 focus:ring-tertiary transition-all outline-none" id="employee-id" placeholder="IL-000000" required="" type="text"/>
</div>
</div>
<div class="space-y-stack-sm">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-secondary ml-1" for="password">SENHA</label>
<a class="font-label-md text-label-md text-primary hover:underline transition-all" href="#">Esqueceu?</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-stack-md text-on-surface-variant pointer-events-none">lock</span>
<input class="w-full h-12 bg-surface-container-lowest border border-border-subtle rounded-lg pl-12 pr-12 text-on-background font-mono-data focus:border-tertiary focus:ring-1 focus:ring-tertiary transition-all outline-none" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-stack-md text-on-surface-variant hover:text-on-surface transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="pass-icon">visibility</span>
</button>
</div>
</div>
<!-- Remember me -->
<div class="flex items-center space-x-stack-md">
<input class="w-4 h-4 rounded-sm bg-surface-container-low border-border-subtle text-primary-container focus:ring-primary-container" id="remember" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant select-none" for="remember">Lembrar este dispositivo</label>
</div>

<button class="w-full h-14 bg-primary-container text-on-primary-container font-headline-md text-headline-md rounded-lg flex items-center justify-center gap-stack-md hover:brightness-110 active:scale-[0.98] transition-all duration-200" type="submit">

<!-- Visual Accents (Cinematic Flare) -->
<div class="fixed bottom-0 left-0 w-full h-1 bg-gradient-to-r from-primary-container via-tertiary to-status-warning opacity-30"></div>
<script>
        function togglePassword() {
            const passInput = document.getElementById('password');
            const passIcon = document.getElementById('pass-icon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                passIcon.textContent = 'visibility_off';
            } else {
                passInput.type = 'password';
                passIcon.textContent = 'visibility';
            }
        }

        // Add a subtle parallax movement to background on mouse move
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) / 50;
            const moveY = (e.clientY - window.innerHeight / 2) / 50;
            document.querySelector('.bg-login-overlay').style.transform = `scale(1.05) translate(${moveX}px, ${moveY}px)`;
        });
    </script>
<script>
// Click on demo users to fill form
document.querySelectorAll("[data-demo]").forEach(b => {
  b.addEventListener("click", () => {
    document.getElementById("employee-id").value = b.dataset.id || "IL-000001";
    document.getElementById("password").value = "123456";
  });
});
</script>
